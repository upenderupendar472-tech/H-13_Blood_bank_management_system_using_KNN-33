{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2>Register as Blood Donor</h2>
        
        <form method="POST" class="donor-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="blood_group">Blood Group</label>
                    <select id="blood_group" name="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="18" max="65" required>
                </div>
                
                <div class="form-group">
                    <label for="location">Location/City</label>
                    <input type="text" id="location" name="location" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="last_donation">Last Donation Date (Optional)</label>
                    <input type="date" id="last_donation" name="last_donation">
                </div>
                
                <div class="form-group">
                    <label for="health_status">Health Status</label>
                    <select id="health_status" name="health_status">
                        <option value="Excellent">Excellent</option>
                        <option value="Good" selected>Good</option>
                        <option value="Fair">Fair</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">Register as Donor</button>
        </form>
    </div>
</div>
{% endblock %}
