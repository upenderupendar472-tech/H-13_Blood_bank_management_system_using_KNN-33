{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2>Request Blood</h2>
        
        <form method="POST" class="patient-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Patient Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="blood_group">Required Blood Group</label>
                    <select id="blood_group" name="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="age">Patient Age</label>
                    <input type="number" id="age" name="age" min="1" max="100" required>
                </div>
                
                <div class="form-group">
                    <label for="location">Location/City</label>
                    <input type="text" id="location" name="location" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="units_needed">Units Needed</label>
                    <input type="number" id="units_needed" name="units_needed" min="1" max="10" required>
                </div>
                
                <div class="form-group">
                    <label for="urgency">Urgency Level</label>
                    <select id="urgency" name="urgency" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
            </div>
            
            <div class="form-info">
                <p>💡 <strong>Note:</strong> Our KNN algorithm will automatically find the most suitable donors based on blood compatibility, location, and availability.</p>
            </div>
            
            <button type="submit" class="btn btn-danger btn-full">Submit Blood Request</button>
        </form>
    </div>
</div>
{% endblock %}
